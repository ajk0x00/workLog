services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worklog_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      DB_SSL: ${DB_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:-worklog-super-secret-key-change-in-production-2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - "${APP_PORT:-80}:3000"

  # Optional local postgres service (only used if you want a local DB instead of external)
  db:
    image: postgres:16-alpine
    container_name: worklog_postgres
    restart: unless-stopped
    profiles:
      - local-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-worklog}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-worklog}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: worklog_postgres_data
